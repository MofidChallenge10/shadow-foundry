<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shadow Foundry</title><style>:root{font-family:system-ui,sans-serif;background:#efe6d8;color:#302b28}*{box-sizing:border-box}body{margin:0}.bar{padding:20px 5vw;border-bottom:1px solid #cfc0ae;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.14em}.main{max-width:1080px;margin:auto;padding:58px 24px}.intro{max-width:600px}.intro small{color:#9b5d40;font-weight:800;letter-spacing:.18em}.intro h1{font:clamp(3rem,7vw,5.6rem)/.9 Georgia,serif;letter-spacing:-.06em;margin:18px 0}.intro p{line-height:1.6;color:#71655a}.bench{display:grid;grid-template-columns:320px 1fr;margin-top:38px;background:#f8f3eb;border:1px solid #cfc0ae}.form{padding:25px;border-right:1px solid #cfc0ae}.form label{display:grid;grid-template-columns:1fr 90px;gap:12px;align-items:center;margin:17px 0;font-size:13px}.form input{width:100%;accent-color:#9b5d40}.form input[type=color]{height:34px}.preview{min-height:380px;display:grid;place-items:center;background:#e8ddcd}.tile{width:min(60%,330px);aspect-ratio:1.5;background:#fffaf1;display:grid;place-items:center;font:28px Georgia,serif;box-shadow:12px 18px 28px 2px rgba(48,43,40,.24)}.code{padding:16px;background:#302b28;color:#f8e8d5;display:flex;gap:12px;align-items:center}.code code{flex:1;overflow-wrap:anywhere}.code button{padding:10px 14px;border:0;background:#d18a5e;color:#201a17;font-weight:800;cursor:pointer}@media(max-width:700px){.bench{grid-template-columns:1fr}.form{border-right:0;border-bottom:1px solid #cfc0ae}.preview{min-height:290px}}</style></head><body><header class="bar"><span>OBJECTS & DEPTH</span><span>SHADOW FOUNDRY / 03</span></header><main class="main"><section class="intro"><small>LIGHT LEAVES A TRACE</small><h1>Give the<br>surface a lift.</h1><p>Dial in a shadow that supports the hierarchy without stealing the scene.</p></section><section class="bench"><div class="form"><label>X offset <input id="x" type="range" min="-30" max="30" value="12"></label><label>Y offset <input id="y" type="range" min="-30" max="40" value="18"></label><label>Blur <input id="blur" type="range" min="0" max="60" value="28"></label><label>Spread <input id="spread" type="range" min="-20" max="20" value="2"></label><label>Color <input id="color" type="color" value="#302b28"></label><label>Opacity <input id="opacity" type="range" min="0" max="100" value="24"></label><label><span>Inset shadow</span><input id="inset" type="checkbox"></label></div><div><div class="preview"><div id="tile" class="tile">A little depth</div></div><div class="code"><code id="css" aria-live="polite"></code><button id="copy">Copy</button></div></div></section></main><script type="module" src="app.mjs"></script></body></html>
